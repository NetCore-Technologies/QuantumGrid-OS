name: QuantumGrid quality gates

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantumgrid-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: Existing control centre lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/quantumgrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/quantumgrid/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Test guarded IPv4 office segment provisioning API requests
        run: node --experimental-strip-types --test ../../tests/office-segment-api.test.mjs
      - name: Test guarded bridge VLAN API requests and response verification
        run: node --experimental-strip-types --test ../../tests/office-vlan-api.test.mjs
      - name: Test guarded inter-zone forwarding API requests and response verification
        run: node --experimental-strip-types --test ../../tests/office-forwarding-api.test.mjs
      - name: Test guarded firewall zone policy API requests and response verification
        run: node --experimental-strip-types --test ../../tests/office-zone-policy-api.test.mjs
      - name: Test guarded AP-to-VLAN network binding API requests
        run: node --experimental-strip-types --test ../../tests/wireless-vlan-api.test.mjs
      - name: Test DHCPv6 RA and NDP scope API requests and response verification
        run: node --experimental-strip-types --test ../../tests/office-dhcp-ipv6-api.test.mjs
      - name: Test guarded SSID-to-LAN/VLAN binding API contract
        run: node --experimental-strip-types --test ../../tests/office-wifi-network-api.test.mjs
      - name: Test guarded WAN port-forward API contract
        run: node --experimental-strip-types --test ../../tests/office-port-forward-api.test.mjs
      - name: Test CAKE profile API contract
        run: node --experimental-strip-types --test ../../tests/sqm-cake-profile-api.test.mjs
      - name: Test per-client DSCP API contract
        run: node --experimental-strip-types --test ../../tests/sqm-client-qos-api.test.mjs
      - name: Test Wi-Fi channel planner
        run: node --experimental-strip-types --test ../../tests/wifi-channel-planner.test.mjs
      - name: Test local Wi-Fi client history
        run: node --experimental-strip-types --test ../../tests/wifi-client-history.test.mjs
      - name: Test firewall posture review
        run: node --experimental-strip-types --test ../../tests/firewall-posture.test.mjs
      - name: Test policy routing table coverage analysis
        run: node --experimental-strip-types --test ../../tests/policy-routing-analysis.test.mjs
      - name: Test measured interface throughput rates
        run: node --experimental-strip-types --test ../../tests/interface-rates.test.mjs
      - name: Test measured WireGuard peer rates
        run: node --experimental-strip-types --test ../../tests/wireguard-peer-rates.test.mjs
      - name: Test bounded conntrack history
        run: node --experimental-strip-types --test ../../tests/conntrack-history.test.mjs
      - name: Audit npm dependency advisories
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/quantumgrid-npm-audit.json
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("/tmp/quantumgrid-npm-audit.json", "utf8"));
          const vulnerabilities = report.vulnerabilities ?? {};
          const findings = Object.entries(vulnerabilities).map(([name, item]) => ({
            name,
            severity: item.severity,
            range: item.range,
            direct: item.isDirect,
            fixAvailable: item.fixAvailable,
            advisories: (item.via ?? []).filter((entry) => typeof entry === "object").map((entry) => ({
              title: entry.title,
              url: entry.url,
              range: entry.range,
            })),
          }));
          console.log(JSON.stringify({
            summary: report.metadata?.vulnerabilities ?? {},
            findings,
          }, null, 2));
          if ((report.metadata?.vulnerabilities?.high ?? 0) > 0 ||
              (report.metadata?.vulnerabilities?.critical ?? 0) > 0) {
            process.exitCode = 1;
          }
          NODE

  website:
    name: Static website validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 scripts/check-website.py
      - run: node --check docs/site.js

  firmware-scripts:
    name: Firmware integration checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua syntax checker
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Check shell and Lua syntax
        run: |
          bash -n build.sh
          bash -n quantumgrid-configure.sh
          bash -n scripts/setup-aw1000-phone-feed.sh
          bash -n scripts/verify-aw1000-ubi.sh
          bash -n scripts/install-aw1000-ubi.sh
          sh -n scripts/inspect-aw1000-install-target.sh
          sh -n files/etc/uci-defaults/91-quantumgrid-usteer-safe
          sh -n files/etc/uci-defaults/92-quantumgrid-nss-safe
          bash -n tests/nss-build-profile-smoke.sh
          bash -n tests/install-aw1000-target-inspector-smoke.sh
          bash -n scripts/verify-aw1000-release-manifest.sh
          bash -n tests/install-aw1000-ubi-smoke.sh
          sh -n scripts/verify-openwrt-source.sh
          bash -n tests/openwrt-source-pin-smoke.sh
          bash tests/openwrt-source-pin-smoke.sh
          sh -n files/usr/bin/quantumgrid-hardware-io
          sh -n files/usr/bin/quantumgrid-button-events
          sh -n files/etc/init.d/quantumgrid-button-events
          sh -n files/etc/uci-defaults/94-quantumgrid-button-events
          sh -n files/etc/uci-defaults/95-quantumgrid-https-only
          sh -n files/etc/uci-defaults/93-quantumgrid-audit-backup
          bash -n tests/firmware-smoke.sh
          luac5.1 -p files/usr/lib/lua/luci/controller/quantumgrid.lua
          luac5.1 -p files/usr/lib/lua/luci/quantumgrid/routing.lua
          luac5.1 -p files/usr/lib/lua/luci/quantumgrid/sqm.lua
          luac5.1 -p files/usr/lib/lua/luci/quantumgrid/qos.lua
          luac5.1 -p files/usr/lib/lua/luci/quantumgrid/mwan3.lua
          luac5.1 -p files/usr/lib/lua/luci/quantumgrid/wireguard.lua
          luac5.1 -p files/usr/lib/lua/luci/quantumgrid/conntrack.lua
          luac5.1 -p files/usr/lib/lua/luci/quantumgrid/wireless.lua
          luac5.1 -p files/usr/lib/lua/luci/quantumgrid/packages.lua
          luac5.1 -p files/usr/lib/lua/luci/quantumgrid/package_operations.lua
          luac5.1 -p files/usr/lib/lua/luci/quantumgrid/kernel_modules.lua
          luac5.1 -p files/usr/lib/lua/luci/quantumgrid/hardware_io.lua
          luac5.1 -p files/usr/lib/lua/luci/quantumgrid/office_networks.lua
          luac5.1 -p files/usr/lib/lua/luci/quantumgrid/firewall_inventory.lua
          luac5.1 -p files/usr/lib/lua/luci/quantumgrid/firewall_runtime.lua
          luac5.1 -p files/usr/lib/lua/luci/quantumgrid/management_transport.lua
          luac5.1 -p files/usr/lib/lua/luci/quantumgrid/config_backup.lua
          luac5.1 -p files/usr/lib/lua/luci/quantumgrid/audit.lua
          luac5.1 -p files/usr/lib/lua/luci/quantumgrid/remote_syslog.lua
          luac5.1 -p files/usr/lib/lua/luci/quantumgrid/acceleration.lua
      - name: Test IPv4 and IPv6 policy rule parser
        run: lua5.1 tests/policy-routing.lua
      - name: Test bounded SQM queue update validation
        run: lua5.1 tests/sqm-controls.lua
      - name: Test per-client DSCP policy validation and inventory
        run: lua5.1 tests/qos.lua
      - name: Test bounded mwan3 tracker telemetry
        run: lua5.1 tests/mwan3-status.lua
      - name: Test redacted WireGuard peer telemetry
        run: lua5.1 tests/wireguard-status.lua
      - name: Test read-only conntrack capacity telemetry
        run: lua5.1 tests/conntrack-status.lua
      - name: Test wireless configuration validation
        run: lua5.1 tests/wireless-controls.lua
      - name: Test installed APK and OPKG package inventory
        run: lua5.1 tests/packages-inventory.lua
      - name: Test safe APK and OPKG package operations
        run: lua5.1 tests/package-operations.lua
      - name: Test installed and loaded kernel module inventory
        run: lua5.1 tests/kernel-modules.lua
      - name: Test GPIO inventory and guarded LED controls
        run: lua5.1 tests/hardware-io.lua
      - name: Test office VLAN and network segmentation inventory
        run: lua5.1 tests/office-networks.lua
      - name: Test firewall NAT redirect projection and redaction
        run: lua5.1 tests/firewall-inventory.lua
      - name: Test live fw4 chain inventory and redaction
        run: lua5.1 tests/firewall-runtime.lua
      - name: Test administrator HTTPS management transport posture
        run: lua5.1 tests/management-transport.lua
      - name: Test secure configuration backup validation
        run: lua5.1 tests/config-backup.lua
      - name: Test redacted and bounded office admin audit events
        run: lua5.1 tests/audit-log.lua
      - name: Test native remote syslog validation
        run: lua5.1 tests/remote-syslog.lua
      - name: Test NSS EDMA and PPE readiness states
        run: lua5.1 tests/acceleration-status.lua
      - name: Test optional AW1000 NSS build profile
        run: bash tests/nss-build-profile-smoke.sh
      - name: Test read-only AW1000 install-target inspection
        run: bash tests/install-aw1000-target-inspector-smoke.sh
      - name: Check AW1000 profile, RJ11 safety and UI telemetry
        run: bash tests/firmware-smoke.sh
