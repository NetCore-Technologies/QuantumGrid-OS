name: QuantumGrid quality gates

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantumgrid-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: Existing control centre lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/quantumgrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/quantumgrid/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Audit npm dependency advisories
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/quantumgrid-npm-audit.json
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("/tmp/quantumgrid-npm-audit.json", "utf8"));
          const vulnerabilities = report.vulnerabilities ?? {};
          const findings = Object.entries(vulnerabilities).map(([name, item]) => ({
            name,
            severity: item.severity,
            range: item.range,
            direct: item.isDirect,
            fixAvailable: item.fixAvailable,
            advisories: (item.via ?? []).filter((entry) => typeof entry === "object").map((entry) => ({
              title: entry.title,
              url: entry.url,
              range: entry.range,
            })),
          }));
          console.log(JSON.stringify({
            summary: report.metadata?.vulnerabilities ?? {},
            findings,
          }, null, 2));
          if ((report.metadata?.vulnerabilities?.high ?? 0) > 0 ||
              (report.metadata?.vulnerabilities?.critical ?? 0) > 0) {
            process.exitCode = 1;
          }
          NODE

  website:
    name: Static website validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 scripts/check-website.py
      - run: node --check docs/site.js

  firmware-scripts:
    name: Firmware integration checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua syntax checker
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Check shell and Lua syntax
        run: |
          bash -n build.sh quantumgrid-configure.sh scripts/setup-aw1000-phone-feed.sh tests/firmware-smoke.sh
          luac5.1 -p files/usr/lib/lua/luci/controller/quantumgrid.lua
      - name: Check AW1000 profile, RJ11 safety and UI telemetry
        run: bash tests/firmware-smoke.sh

  cleanup-obsolete-branches:
    name: Delete only verified merged branches
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify PR merge state and branch heads before deletion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${COMMIT_MESSAGE}" != "chore: clean up merged branches" ]]; then
            echo "SKIP: this is not the requested one-time cleanup commit"
            exit 0
          fi
          open_heads="$(gh api --paginate "repos/${REPOSITORY}/pulls?state=open&per_page=100" --jq '.[].head.ref')"

          remove_branch() {
            local branch="$1"
            local expected_sha="$2"
            local merged_pr="$3"
            local actual_sha
            actual_sha="$(git ls-remote origin "refs/heads/${branch}" | awk 'NR == 1 { print $1 }')"

            if [[ -z "${actual_sha}" || "${actual_sha}" != "${expected_sha}" ]]; then
              echo "SKIP ${branch}: branch head changed or no longer exists"
              return 0
            fi
            if grep -Fxq "${branch}" <<< "${open_heads}"; then
              echo "SKIP ${branch}: an open pull request still references it"
              return 0
            fi

            if [[ -n "${merged_pr}" ]]; then
              local pr_head pr_merged_at
              pr_head="$(gh api "repos/${REPOSITORY}/pulls/${merged_pr}" --jq '.head.ref')"
              pr_merged_at="$(gh api "repos/${REPOSITORY}/pulls/${merged_pr}" --jq '.merged_at')"
              if [[ "${pr_head}" != "${branch}" || "${pr_merged_at}" == "null" || -z "${pr_merged_at}" ]]; then
                echo "SKIP ${branch}: expected pull request ${merged_pr} is not merged"
                return 0
              fi
            else
              if ! git merge-base --is-ancestor "${expected_sha}" "${TARGET_SHA}"; then
                echo "SKIP ${branch}: its head is not contained in main history"
                return 0
              fi
            fi

            gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${branch}" >/dev/null
            echo "DELETED ${branch} (${expected_sha})"
          }

          remove_branch "ci/aw1000-build-on-main" "32dc09e6562be84737107db1b00334a25c67aeca" "6"
          remove_branch "copilot/fix-failing-github-actions-job" "b21a8ce93c0cb42757c3b391112e4913615404ae" "10"
          remove_branch "feat/authenticated-live-telemetry" "17932cc43be565cea7f6f20d015f296f1554796a" "9"
          remove_branch "feat/live-aw1000-device-inventory" "5a479e3326d0d809166eb00eb844f34bc699f84" ""
          remove_branch "feat/package-quantumgrid-ui" "cbdbf60ef576abe849fd90e503eb94ff4a7547b2" "8"
          remove_branch "feat/quantumgrid-site-release-pipeline" "54ef606828d21e71de3fc3c520533e1a0f380b52" "4"
          remove_branch "fix/openwrt-phone-feed-name" "a629aef659963ca9d1029a99aff0f32eb9796453" "7"
          remove_branch "fix/pages-enablement-gate" "492679e19829642aed0e42348daef549b8a57f39" "5"
