name: QuantumGrid GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/check-website.py"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/check-website.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantumgrid-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local links, metadata and sitemap
        run: python3 scripts/check-website.py
      - name: Check website JavaScript
        run: node --check website/site.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: website

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
