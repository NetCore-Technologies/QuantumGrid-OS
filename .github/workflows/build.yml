kname: QuantumGrid OS

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to build (or "all")'
        default: 'all'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        target:
          - arcadyan-aw1000
          - xiaomi-ax3600
          - xiaomi-ax9000
          - xiaomi-ax10000
          - generic-ipq807x

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 \
            python3-setuptools rsync unzip zlib1g-dev \
            file wget

      - name: Build ${{ matrix.target }}
        run: bash scripts/build.sh ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quantumgrid-${{ matrix.target }}
          path: dist/${{ matrix.target }}/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          body: |
            ## QuantumGrid OS ${{ github.ref_name }}
            **Netcore Technologies**

            ### Supported devices

            | Target | SOC | Notes |
            |--------|-----|-------|
            | arcadyan-aw1000 | IPQ8072A | Primary — AW1000 + 5G |
            | xiaomi-ax3600 | IPQ8071A | NSS build |
            | xiaomi-ax9000 | IPQ8072A | Tri-band |
            | xiaomi-ax10000 | IPQ8072A | Quad-band |
            | generic-ipq807x | IPQ807x | Older devices |

            ### Flash instructions
            # Sysupgrade (already on OpenWrt)
            scp quantumgrid-*-sysupgrade.bin root@192.168.1.1:/tmp/
            ssh root@192.168.1.1 sysupgrade -v /tmp/*.bin

            bash scripts/flash.sh arcadyan-aw1000 192.168.1.1
