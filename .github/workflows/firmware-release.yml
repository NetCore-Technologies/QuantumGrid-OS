name: QuantumGrid AW1000 firmware release

on:
  # Full OpenWrt builds run only for published-version tags or an explicit manual dispatch.
  # Ordinary main-branch changes use the fast CI and firmware-smoke gates instead.
  push:
    tags:
      - "qg-v*"
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: "OpenWrt tag or commit to build"
        required: true
        default: "v25.12.6"
        type: string
      openwrt_expected_sha:
        description: "Expected full 40-character commit SHA for the selected OpenWrt ref"
        required: true
        default: "64900e756efa667774214f9c6b17c113222e01f7"
        type: string
      phone_ref:
        description: "AW1000 phone feed tag to build"
        required: true
        default: "v0.9.0"
        type: string
      phone_expected_sha:
        description: "Expected full 40-character commit SHA for the selected phone feed tag"
        required: true
        default: "fe85222e57d1c3e191ffb976b37667bbf221a020"
        type: string
      enable_nss:
        description: "Build experimental Qualcomm NSS/EDMA profile (qosmio 25.12-nss fork)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: quantumgrid-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and package AW1000 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      QG_OPENWRT_REF: ${{ inputs.openwrt_ref || 'v25.12.6' }}
      QG_OPENWRT_EXPECTED_SHA: ${{ inputs.openwrt_expected_sha || '64900e756efa667774214f9c6b17c113222e01f7' }}
      QG_AW1000_PHONE_REF: ${{ inputs.phone_ref || 'v0.9.0' }}
      QG_AW1000_PHONE_EXPECTED_SHA: ${{ inputs.phone_expected_sha || 'fe85222e57d1c3e191ffb976b37667bbf221a020' }}
      QG_ENABLE_NSS: ${{ inputs.enable_nss && '1' || '0' }}
      QG_NSS_OPENWRT_REF: "25.12-nss"
      QG_NSS_EXPECTED_SHA: "d6848fa2ea00193b5b7d3973e3990da7f608027c"
      QG_BUILD_JOBS: "2"
    steps:
      - name: Checkout QuantumGrid source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned upstream v4
        with:
          fetch-depth: 0

      - name: Free space for OpenWrt compilation
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          df -h

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ack asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex \
            gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged \
            help2man libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool lld llvm lrzsz mkisofs nano ninja-build p7zip-full patch pkgconf \
            python3 python3-pip python3-ply python3-docutils qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs unzip vim wget xmlto xxd \
            zlib1g-dev zstd

      - name: Set up Node.js for the QuantumGrid control centre
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned upstream v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/quantumgrid/package-lock.json

      - name: Build AW1000 firmware and install the control centre
        shell: bash
        run: |
          set -Eeuo pipefail
          bash ./build.sh

      - name: Assemble firmware assets and provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE_DIR="openwrt/bin/targets/qualcommax/ipq807x"
          test -d "$IMAGE_DIR" || { echo "Missing AW1000 image output: $IMAGE_DIR" >&2; exit 1; }

          rm -rf dist
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#qg-}"
          if [[ "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            VERSION="manual-build-${GITHUB_RUN_NUMBER}"
          fi
          if [[ "$QG_ENABLE_NSS" == "1" ]]; then
            VERSION="${VERSION}-nss"
          fi

          copy_required() {
            local pattern="$1"
            local output="$2"
            local -a matches=()
            mapfile -t matches < <(find "$IMAGE_DIR" -maxdepth 1 -type f -name "$pattern" -print | sort)
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "Expected exactly one AW1000 image for pattern '$pattern'; found ${#matches[@]}." >&2
              printf '  %s\n' "${matches[@]}" >&2
              exit 1
            fi
            local source="${matches[0]}"
            [[ -s "$source" ]] || { echo "AW1000 image is empty: $source" >&2; exit 1; }
            cp "$source" "dist/$output"
            printf 'Included: %s\n' "$source"
          }

          copy_required "*arcadyan_aw1000-squashfs-factory.ubi" \
            "QuantumGrid-OS-${VERSION}-AW1000-squashfs-factory.ubi"
          bash scripts/verify-aw1000-ubi.sh \
            "dist/QuantumGrid-OS-${VERSION}-AW1000-squashfs-factory.ubi"
          cp scripts/install-aw1000-ubi.sh dist/install-aw1000-ubi.sh
          cp scripts/inspect-aw1000-install-target.sh dist/inspect-aw1000-install-target.sh
          cp scripts/verify-aw1000-release-manifest.sh dist/verify-aw1000-release-manifest.sh
          cp scripts/verify-aw1000-release-attestation.sh dist/verify-aw1000-release-attestation.sh
          copy_required "*arcadyan_aw1000-initramfs-uImage.itb" \
            "QuantumGrid-OS-${VERSION}-AW1000-initramfs-uImage.itb"

          [[ -d openwrt/bin/packages ]] || { echo "OpenWrt package output directory is missing." >&2; exit 1; }
          PACKAGE_COUNT="$(find openwrt/bin/packages -type f \( -name '*.apk' -o -name '*.ipk' \) -size +0c -print | wc -l | tr -d '[:space:]')"
          [[ "$PACKAGE_COUNT" =~ ^[1-9][0-9]*$ ]] || { echo "No non-empty APK/IPK packages were produced." >&2; exit 1; }
          PACKAGE_ARCHIVE="dist/QuantumGrid-OS-${VERSION}-AW1000-packages.tar.zst"
          tar --zstd -cf "$PACKAGE_ARCHIVE" -C openwrt/bin/packages .
          [[ -s "$PACKAGE_ARCHIVE" ]] || { echo "AW1000 package archive is empty." >&2; exit 1; }

          bash scripts/verify-openwrt-feeds.sh openwrt > dist/OPENWRT-FEEDS.txt
          [[ -s dist/OPENWRT-FEEDS.txt ]] || { echo "OpenWrt feed revision report is missing." >&2; exit 1; }

          MANIFEST="$(find "$IMAGE_DIR" -maxdepth 1 -type f -name '*arcadyan_aw1000*.manifest' -print -quit)"
          [[ -n "$MANIFEST" && -s "$MANIFEST" ]] || { echo "The AW1000 installed-package manifest is required to produce an accurate SBOM." >&2; exit 1; }
          cp "$MANIFEST" "dist/QuantumGrid-OS-${VERSION}-AW1000-PACKAGE-MANIFEST.txt"

          git -C third_party/openwrt-aw1000-phone archive --format=tar.gz \
            --output="dist/QuantumGrid-OS-${VERSION}-AW1000-phone-source.tar.gz" HEAD

          SOURCE_SHA="$(git rev-parse HEAD)"
          OPENWRT_SHA="$(git -C openwrt rev-parse HEAD)"
          PHONE_REF="${QG_AW1000_PHONE_REF:-v0.9.0}"
          PHONE_EXPECTED_SHA="${QG_AW1000_PHONE_EXPECTED_SHA:-fe85222e57d1c3e191ffb976b37667bbf221a020}"
          PHONE_SHA="$(git -C third_party/openwrt-aw1000-phone rev-parse HEAD)"
          CONFIG_SHA="$(sha256sum configs/aw1000-max.config | cut -d' ' -f1)"
          NSS_FRAGMENT_SHA="not-used"
          if [[ "$QG_ENABLE_NSS" == "1" ]]; then
            BUILD_PROFILE="AW1000 experimental NSS"
            OPENWRT_REQUESTED_REPO="${QG_NSS_OPENWRT_REPO:-https://github.com/qosmio/openwrt-ipq.git}"
            OPENWRT_REQUESTED_REF="$QG_NSS_OPENWRT_REF"
            OPENWRT_EXPECTED_SHA="$QG_NSS_EXPECTED_SHA"
            NSS_FRAGMENT_SHA="$(sha256sum configs/aw1000-nss.fragment | cut -d' ' -f1)"
          else
            BUILD_PROFILE="AW1000 stable upstream OpenWrt"
            OPENWRT_REQUESTED_REPO="${QG_OPENWRT_REPO:-https://github.com/openwrt/openwrt.git}"
            OPENWRT_REQUESTED_REF="$QG_OPENWRT_REF"
            OPENWRT_EXPECTED_SHA="$QG_OPENWRT_EXPECTED_SHA"
          fi

          {
            echo "QuantumGrid OS — Arcadyan AW1000 firmware"
            echo "Release: $VERSION"
            echo "QuantumGrid source commit: $SOURCE_SHA"
            echo "Build profile: $BUILD_PROFILE"
            echo "NSS enabled: $QG_ENABLE_NSS"
            echo "OpenWrt requested repository: $OPENWRT_REQUESTED_REPO"
            echo "OpenWrt requested ref: $OPENWRT_REQUESTED_REF"
            echo "OpenWrt expected commit: $OPENWRT_EXPECTED_SHA"
            echo "OpenWrt resolved commit: $OPENWRT_SHA"
            echo "OpenWrt package feed revisions: OPENWRT-FEEDS.txt"
            echo "CycloneDX SBOM: QuantumGrid-OS-${VERSION}-AW1000-SBOM.cdx.json"
            echo "AW1000 phone requested ref: $PHONE_REF"
            echo "AW1000 phone expected commit: $PHONE_EXPECTED_SHA"
            echo "AW1000 phone resolved commit: $PHONE_SHA"
            echo "AW1000 config SHA-256: $CONFIG_SHA"
            echo "NSS fragment SHA-256: $NSS_FRAGMENT_SHA"
            echo "Build runner: $RUNNER_OS / $RUNNER_ARCH"
            echo "Build timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Device: Arcadyan AW1000"
            echo "Target: qualcommax/ipq807x"
            echo "Profile: arcadyan_aw1000"
            echo "Persistent firmware format: squashfs factory UBI (.ubi)"
            echo "No sysupgrade.bin image is produced or published for this profile"
            echo "Phone service: installed, disabled by default"
            echo "Voice prerequisites: matching kernel, VoLTE SIM and user-supplied Skyworks SLIC patch"
            if [[ "$QG_ENABLE_NSS" == "1" ]]; then
              echo "NSS acceleration: experimental packages, kernel integration and AW1000 NSS device tree selected; end-to-end offload still requires on-device validation"
              echo "NSS compatibility: generic packet steering/flow offloading disabled by NSS first-boot defaults; DSA bridge VLAN filtering is not supported with NSS Wi-Fi offload"
            else
              echo "NSS acceleration: not included in the stable upstream OpenWrt profile"
            fi
            echo
            echo "OpenWrt source: $OPENWRT_REQUESTED_REPO"
            echo "Phone source: https://github.com/Perz3us/openwrt-aw1000-phone"
          } > dist/BUILDINFO.txt

          cp Docs/PHONE-PORT.md dist/PHONE-PORT.md
          cp Docs/RECOVERY.md dist/RECOVERY.md
          cp configs/aw1000-max.config dist/aw1000-max.config

          python3 -m py_compile scripts/generate-aw1000-sbom.py
          python3 scripts/generate-aw1000-sbom.py \
            --manifest "dist/QuantumGrid-OS-${VERSION}-AW1000-PACKAGE-MANIFEST.txt" \
            --firmware-image "dist/QuantumGrid-OS-${VERSION}-AW1000-squashfs-factory.ubi" \
            --packages-archive "$PACKAGE_ARCHIVE" \
            --feeds-report "dist/OPENWRT-FEEDS.txt" \
            --phone-source-archive "dist/QuantumGrid-OS-${VERSION}-AW1000-phone-source.tar.gz" \
            --build-info "dist/BUILDINFO.txt" \
            --build-config "dist/aw1000-max.config" \
            --output "dist/QuantumGrid-OS-${VERSION}-AW1000-SBOM.cdx.json" \
            --version "$VERSION" \
            --target "qualcommax/ipq807x" \
            --profile "arcadyan_aw1000" \
            --build-profile "$BUILD_PROFILE" \
            --source-commit "$SOURCE_SHA" \
            --openwrt-commit "$OPENWRT_SHA"
          [[ -s "dist/QuantumGrid-OS-${VERSION}-AW1000-SBOM.cdx.json" ]] || { echo "CycloneDX SBOM was not generated." >&2; exit 1; }

          (
            cd dist
            sha256sum -- * > SHA256SUMS
          )

          echo "Final release inventory:"
          ls -lh dist
          echo
          echo "SHA-256 manifest:"
          cat dist/SHA256SUMS

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned upstream v4
        with:
          name: quantumgrid-aw1000-firmware
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest firmware artifacts
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # pinned upstream v4
        with:
          name: quantumgrid-aw1000-firmware
          path: dist

      - name: Generate signed SLSA provenance for release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # pinned upstream v4
        with:
          subject-path: 'dist/*'

  publish:
    name: Publish AW1000 firmware release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/qg-v')
    needs: [build, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # pinned upstream v4
        with:
          name: quantumgrid-aw1000-firmware
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # pinned upstream v2
        with:
          name: QuantumGrid OS ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
